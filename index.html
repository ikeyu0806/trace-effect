<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030711" />
    <meta name="description" content="光を断ち、星空に軌跡を残す90秒のフライト。" />
    <title>TraceEffect</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="宇宙船が暗い星空を飛ぶゲーム画面"></canvas>
      <section id="loading" class="overlay loading" aria-live="polite">
        <div><p class="eyebrow">TRACE EFFECT</p></div>
      </section>
      <section id="intro" class="overlay intro" hidden>
        <div class="intro-copy">
          <h1 class="game-title">TRACE EFFECT</h1>
          <button id="start-button" type="button">GAME START</button>
        </div>
      </section>
      <section id="hud" class="hud" hidden aria-label="飛行状況">
        <div id="lives" class="lives" aria-label="残機 3"></div>
        <div id="progress" class="progress" aria-label="目的の星までの進行度"><i></i></div>
        <p class="destination">APPROACH / 01</p>
        <aside class="controls" aria-label="操作方法">
          <p class="controls-title">CONTROLS</p>
          <p><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span>移動</span></p>
          <p><kbd>SPACE</kbd><span>射撃</span></p>
          <p><kbd>ESC</kbd><span>停止</span></p>
          <p class="mouse-control"><span>マウス ＋ クリックにも対応</span></p>
        </aside>
      </section>
      <section id="pause" class="overlay compact" hidden>
        <div><h2>PAUSE</h2></div>
      </section>
      <section id="end" class="overlay end" hidden>
        <div>
          <h2 id="end-title"></h2>
          <button id="restart-button" type="button">RETRY</button>
        </div>
      </section>
      <p id="status" class="sr-only" aria-live="polite"></p>
      <div class="impact" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
